name: Deploy site to GitHub Pages

# Builds the public files and force-pushes them as a single commit to the
# gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Collect public files only
        run: |
          mkdir _site
          cp -r index.html admin.html 404.html mods.json assets images downloads _site/
          touch _site/.nojekyll

      - name: Push to gh-pages
        run: |
          auth="$(git config --local --get http.https://github.com/.extraheader)"
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "$auth"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
