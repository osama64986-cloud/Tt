name: Deploy site to GitHub Pages

# Builds the public site (scripts/build.py) and force-pushes it as a single
# commit to gh-pages, which GitHub Pages serves. Runs every 6 hours too, so
# the download counts in stats.json stay fresh.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/build.py

      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build the auth header ourselves (checkout v6+ keeps its credentials in a separate file).
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $b64" \
            push -f "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
