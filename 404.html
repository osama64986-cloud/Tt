<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>الصفحة غير موجودة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px;
           font-family: Cairo, system-ui, sans-serif; color: #eee;
           background: repeating-linear-gradient(90deg, #6b6b6b 0 32px, #5e5e5e 32px 64px); }
    .box { background: rgba(0,0,0,.75); border: 4px solid #000; padding: 32px 28px; max-width: 460px; }
    h1 { font-family: "Press Start 2P", monospace; color: #ffd84a; font-size: 2.4rem; margin: 0 0 12px; }
    a { display: inline-block; margin-top: 12px; padding: 10px 24px; background: #5d9c3b; color: #fff;
        font-weight: 800; text-decoration: none; border: 3px solid #000; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>ضعت في الكهف! ⛏ الصفحة اللي تدورها مو موجودة.</p>
    <a href="./">ارجع للرئيسية</a>
  </div>
</body>
</html>
